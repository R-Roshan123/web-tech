<!DOCTYPE html>
<html>
<head>
    <title>Educational Course Portal Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        form {
            width: 600px;
            margin: 20px auto;
            background-color: white;
            padding: 25px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        h3 {
            color: #2c3e50;
            background-color: #eaf2f8;
            padding: 8px;
            border-radius: 5px;
        }

        h4 {
            color: #555;
        }

        label {
            font-weight: bold;
        }

        input,
        select {
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #aaa;
            border-radius: 4px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="number"],
        input[type="date"],
        select {
            width: 95%;
        }

        input[type="radio"],
        input[type="checkbox"] {
            margin-right: 5px;
        }

        input[type="range"] {
            width: 95%;
        }

        input[type="color"] {
            width: 60px;
            height: 35px;
        }

        button {
            display: block;
            margin: 20px auto 5px;
            padding: 10px 25px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>

<body>

<h2>Educational Course Portal Registration Form</h2>

<form action="#" method="post">

    <!-- Personal Details -->
    <h3>Personal Details</h3>

    <label for="name">Full Name:</label><br>
    <input type="text" id="name" name="name"
           placeholder="Enter your name" required>
    <br><br>

    <label for="email">Email:</label><br>
    <input type="email" id="email" name="email"
           placeholder="Enter your email" required>
    <br><br>

    <label for="password">Password:</label><br>
    <input type="password" id="password" name="password"
           placeholder="Enter password" required>
    <br><br>

    <label for="age">Age:</label><br>
    <input type="number" id="age" name="age"
           min="18" max="60">
    <br><br>

    <label for="dob">Date of Birth:</label><br>
    <input type="date" id="dob" name="dob">
    <br><br>

    <label>Gender:</label><br>
    <input type="radio" name="gender" value="male"> Male
    <input type="radio" name="gender" value="female"> Female
    <br><br>

    <label>Skills:</label><br>
    <input type="checkbox" name="skills" value="html"> HTML
    <input type="checkbox" name="skills" value="css"> CSS
    <input type="checkbox" name="skills" value="js"> JavaScript
    <br><br>

    <label for="course">Course:</label><br>
    <select id="course" name="course">
        <option value="">-- Select Course --</option>
        <option value="cse">CSE</option>
        <option value="it">IT</option>
        <option value="ece">ECE</option>
    </select>
    <br><br>

    <label for="city">City:</label><br>
    <input list="cities" id="city" name="city"
           placeholder="Enter your city">

    <datalist id="cities">
        <option value="Coimbatore">
        <option value="Chennai">
        <option value="Madurai">
    </datalist>
    <br><br>

    <label for="rating">Rate your skills:</label><br>
    <input type="range" id="rating" name="rating"
           min="1" max="10">
    <br><br>

    <label for="color">Favorite Color:</label><br>
    <input type="color" id="color" name="color">
    <br><br>


    <!-- Academic Details -->
    <h3>Academic Details</h3>

    <h4>School Details</h4>

    <label for="school">School Name:</label><br>
    <input type="text" id="school" name="school"
           placeholder="Enter school name">
    <br><br>

    <label for="board">Board of Education:</label><br>
    <select id="board" name="board">
        <option value="">-- Select Board --</option>
        <option>State Board</option>
        <option>CBSE</option>
        <option>ICSE</option>
        <option>Matriculation</option>
    </select>
    <br><br>

    <label for="schoolyear">Year of Passing:</label><br>
    <input type="number" id="schoolyear" name="schoolyear"
           min="2000" max="2035">
    <br><br>

    <label for="schoolmark">Percentage/CGPA:</label><br>
    <input type="text" id="schoolmark" name="schoolmark"
           placeholder="Eg: 92% or 9.1 CGPA">
    <br><br>


    <h4>College Details</h4>

    <label for="college">College Name:</label><br>
    <input type="text" id="college" name="college"
           placeholder="Enter college name">
    <br><br>

    <label for="degree">Degree:</label><br>
    <select id="degree" name="degree">
        <option value="">-- Select Degree --</option>
        <option>B.E.</option>
        <option>B.Tech</option>
        <option>B.Sc</option>
        <option>BCA</option>
        <option>B.Com</option>
        <option>Other</option>
    </select>
    <br><br>

    <label for="department">Department:</label><br>
    <input type="text" id="department" name="department"
           placeholder="Enter department">
    <br><br>

    <label for="year">Current Year:</label><br>
    <select id="year" name="year">
        <option value="">-- Select Year --</option>
        <option>I Year</option>
        <option>II Year</option>
        <option>III Year</option>
        <option>IV Year</option>
    </select>
    <br><br>

    <label for="regno">Register Number:</label><br>
    <input type="text" id="regno" name="regno"
           placeholder="Enter register number">
    <br><br>

    <label for="cgpa">Current CGPA:</label><br>
    <input type="number" id="cgpa" name="cgpa"
           min="0" max="10" step="0.01">
    <br><br>


    <!-- Submit Button -->
    <button type="submit">Register</button>

</form>

</body>
</html>
